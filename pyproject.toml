[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos"
version = "0.1.0"
description = "Video understanding platform for long-form video analysis combining visual and audio context."
requires-python = ">=3.10"
dependencies = [
    # Environment
    "python-dotenv>=1.1.0",

    # General utilities
    "numpy>=1.26,<2",
    "pandas>=2.0",
    "tabulate>=0.10.0",
    "tqdm>=4.66.1",

    # System monitoring
    "psutil>=5.9.0",
    "nvidia-ml-py>=12.0",

    # Video processing
    "opencv-python>=4.7",
    "scenedetect>=0.6",
    "imageio_ffmpeg>=0.5.0",

    # Deep learning (torch, torchvision, torchaudio managed by conda — see environment.yml)
    "transformers>=4.30",
    "Pillow>=10.0",
    "sentencepiece>=0.2.0",
    "einops>=0.8.0",

    # Object detection
    "ultralytics>=8.0",

    # Audio
    "av>=12.0",
    "librosa>=0.10",
    "openai-whisper",
    "noisereduce>=3.0",
    "ffmpeg-python>=0.1.20",

    # LLM clients
    "openai>=1.9.2",
    "google-genai>=1.0",
    "anthropic[vertex]>=0.43",

    # RAG
    "scikit-learn>=1.3",
    "emoji",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0",
    "pytest-mock>=3.14",
]

[project.scripts]
kairos = "kairos.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kairos*"]

[tool.setuptools.package-data]
kairos = ["prompts/*.txt", "prompts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires API keys (deselect with -m 'not integration')",
    "model: requires GPU or model weights (deselect with -m 'not model')",
    "e2e: full pipeline end-to-end (deselect with -m 'not e2e')",
]
